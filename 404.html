<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <main class="section" style="border-top:0;min-height:100vh;display:flex;align-items:center">
    <div class="wrap">
      <p class="kicker">404 &mdash; No signal</p>
      <h1>This page isn&rsquo;t on the network.</h1>
      <p class="hero-sub">The link may be old, or the page never existed.</p>
      <a class="btn btn-primary" href="/">Back to vedantam.co</a>
    </div>
  </main>
</body>
</html>
